<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<title>Direktor paneli — Shokirov Math Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/app.css?v=38c188e7" />
</head>
<body>
<header class="app-header">
  <div class="container wide bar">
    <a href="index.html" class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6.5 L8 6.5 L13 12 L8 17.5 L17 17.5"/></svg></span><span>Shokirov Math<small>Direktor paneli</small></span></a>
    <div class="header-actions">
      <span class="badge new" id="whoami" style="display:none"></span>
      <div class="bil-wrap">
        <button class="icon-btn" id="bilBtn" aria-label="Bildirishnomalar">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
          <span id="bilDot" style="display:none"></span>
        </button>
        <div class="bil-panel" id="bilPanel">
          <div class="hd">
            <b>Bildirishnomalar</b>
            <button onclick="bilHammasi()">Hammasini o'qildi</button>
          </div>
          <div class="bil-list" id="bilList"><div class="empty">Yuklanmoqda…</div></div>
        </div>
      </div>
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Rejim">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="btn btn-ghost btn-sm" onclick="signOut()">Chiqish</button>
    </div>
  </div>
</header>

<main class="container wide page">
  <div class="page-head">
    <h1>Moliyaviy nazorat</h1>
    <p class="muted">To'lovlar shaffofligi va umumiy ko'rsatkichlar</p>
  </div>

  <div class="spread" style="margin-bottom:18px; gap:10px; flex-wrap:wrap;">
    <div class="section-title">Oy bo'yicha</div>
    <div style="display:flex; gap:9px; flex-wrap:wrap; align-items:center;">
      <button class="btn btn-ghost btn-sm" onclick="tolovEksport()">
        <svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg> Shu oy to'lovlari
      </button>
      <button class="btn btn-ghost btn-sm" onclick="yuklab('/api/export/payments.csv','tolovlar-hammasi.csv')">
        <svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg> Barcha davrlar
      </button>
      <input class="input" type="month" id="mon" style="max-width:180px" onchange="loadAll()" />
    </div>
  </div>

  <div id="statsBox"><div class="empty">Yuklanmoqda…</div></div>

  <div class="card" style="margin-top:18px;">
    <div class="spread" style="margin-bottom:14px;">
      <div class="section-title">Talabalar to'lovi</div>
      <div class="seg">
        <button id="f-all" class="on" onclick="setFilter('all')">Hammasi</button>
        <button id="f-paid" onclick="setFilter('paid')">To'lagan</button>
        <button id="f-unpaid" onclick="setFilter('unpaid')">To'lamagan</button>
      </div>
    </div>
    <div id="payList"><div class="empty">Yuklanmoqda…</div></div>
  </div>

  <div class="card" style="margin-top:18px;">
    <div class="section-title" style="margin-bottom:14px;">Oylar bo'yicha tushum</div>
    <div id="monthsBox"><div class="empty">Yuklanmoqda…</div></div>
  </div>
</main>

<script src="assets/config.js"></script>
<script src="assets/app.js?v=38c188e7"></script>
<script>
  let ME = null, ROWS = [], FILTER = 'all';
  const money = n => Number(n || 0).toLocaleString('uz-UZ') + " so'm";
  const PAY_UZ = { paid: "To'landi", unpaid: "To'lanmagan", partial: 'Qisman' };

  (async () => {
    ME = await guard('director');
    if (!ME) return;
    bilInit();
    const w = document.getElementById('whoami');
    w.style.display = ''; w.textContent = ME.full_name || 'Direktor';
    document.getElementById('mon').value = new Date().toISOString().slice(0, 7);
    loadAll();
  })();

  function tolovEksport() {
    const p = document.getElementById('mon').value || new Date().toISOString().slice(0, 7);
    yuklab('/api/export/payments.csv?period=' + p, `tolovlar-${p}.csv`);
  }

  function setFilter(f) {
    FILTER = f;
    ['all', 'paid', 'unpaid'].forEach(x => document.getElementById('f-' + x).classList.toggle('on', x === f));
    renderPay();
  }

  async function loadAll() {
    const period = document.getElementById('mon').value || new Date().toISOString().slice(0, 7);
    let d, m;
    try {
      [d, m] = await Promise.all([
        api.get('/api/dashboard/director?period=' + period),
        api.get('/api/payments/month?period=' + period)
      ]);
    } catch (e) {
      document.getElementById('statsBox').innerHTML = `<div class="empty">Xato: ${esc(e.message)}</div>`;
      return;
    }
    ROWS = m.rows;

    const kutilgan = d.jami_talaba * 250000;
    document.getElementById('statsBox').innerHTML = `
      <div class="stats">
        <div class="stat-card accent"><div class="lab">Yig'ilgan</div><div class="val" style="font-size:24px;">${money(d.yigilgan)}</div><div class="sub">${period}</div></div>
        <div class="stat-card ${d.yigilgan >= kutilgan ? 'good' : 'warn'}"><div class="lab">Kutilgan</div><div class="val" style="font-size:24px;">${money(kutilgan)}</div><div class="sub">${d.jami_talaba} talaba × 250 000</div></div>
        <div class="stat-card good"><div class="lab">To'lagan</div><div class="val">${d.tolagan}</div></div>
        <div class="stat-card ${d.tolamagan ? 'bad' : 'good'}"><div class="lab">To'lamagan</div><div class="val">${d.tolamagan}</div></div>
        <div class="stat-card"><div class="lab">Jami talaba</div><div class="val">${d.jami_talaba}</div></div>
      </div>`;

    renderPay();

    const max = Math.max(1, ...d.oylar.map(o => Number(o.summa)));
    document.getElementById('monthsBox').innerHTML = d.oylar.length
      ? `<div class="stack">${d.oylar.map(o => `
          <div class="item">
            <div class="top">
              <div><b>${esc(o.period)}</b><div class="small muted">${o.tolagan}/${o.jami} to'lagan</div></div>
              <b style="font-family:var(--display); color:var(--success)">${money(o.summa)}</b>
            </div>
            <div class="progress" style="margin-top:9px;"><i style="width:${Number(o.summa) / max * 100}%"></i></div>
          </div>`).join('')}</div>`
      : '<div class="empty">Ma\'lumot yo\'q</div>';
  }

  function renderPay() {
    const list = ROWS.filter(x =>
      FILTER === 'all' ? true : FILTER === 'paid' ? x.status === 'paid' : x.status !== 'paid');
    const box = document.getElementById('payList');
    if (!list.length) { box.innerHTML = '<div class="empty">Yozuv yo\'q</div>'; return; }
    box.innerHTML = `<div class="table-wrap"><table>
      <thead><tr><th>Talaba</th><th>Telefon</th><th>Summa</th><th>Sana</th><th>Usul</th><th>Holat</th></tr></thead>
      <tbody>${list.map(s => `<tr>
        <td><b>${esc(s.full_name || 'Ismsiz')}</b></td>
        <td class="small">${esc(s.phone || '—')}</td>
        <td>${s.amount ? money(s.amount) : '<span class="muted">—</span>'}</td>
        <td class="small muted">${s.paid_at ? fmtDate(s.paid_at) : '—'}</td>
        <td class="small">${esc(s.method || '—')}</td>
        <td><span class="pay-pill ${s.status}">${PAY_UZ[s.status]}</span></td>
      </tr>`).join('')}</tbody></table></div>`;
  }
</script>
</body>
</html>
