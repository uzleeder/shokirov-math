<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
<title>Sahifa topilmadi — Shokirov Math Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/assets/app.css?v=38c188e7" />
<style>
  .err-wrap { min-height: calc(100vh - 70px); display: grid; place-items: center; padding: 40px 20px; }
  .err { text-align: center; max-width: 520px; }
  .err .code {
    font-family: var(--display); font-weight: 800; font-size: clamp(72px, 18vw, 150px); line-height: 1;
    background: linear-gradient(120deg, var(--brand-2), var(--brand) 45%, var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -.03em;
  }
  .err h1 { font-family: var(--display); font-size: clamp(21px, 4vw, 27px); margin: 10px 0 10px; }
  .err p { color: var(--muted); font-size: 15.5px; line-height: 1.7; }
  .err .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
  .err .sym { font-family: var(--display); color: var(--border); font-size: 30px; letter-spacing: 18px; margin-top: 30px; user-select: none; }
</style>
</head>
<body>
<header class="app-header">
  <div class="container bar">
    <a href="/index.html" class="brand">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6.5 L8 6.5 L13 12 L8 17.5 L17 17.5"/></svg></span>
      <span>Shokirov Math<small>Academy</small></span>
    </a>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Rejim">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="err-wrap">
  <div class="err">
    <div class="code">404</div>
    <h1>Bunday sahifa topilmadi</h1>
    <p>Siz izlagan sahifa o'chirilgan, ko'chirilgan yoki manzil noto'g'ri yozilgan bo'lishi mumkin.</p>
    <div class="acts">
      <a class="btn btn-primary" href="/index.html">Bosh sahifaga qaytish</a>
      <a class="btn btn-ghost" href="/login.html">Kabinetga kirish</a>
      <a class="btn btn-ghost" href="/verify.html">Sertifikat tekshirish</a>
    </div>
    <div class="sym">Σ π ∞ √</div>
  </div>
</div>

<script src="/assets/config.js"></script>
<script src="/assets/app.js?v=38c188e7"></script>
</body>
</html>
