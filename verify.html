<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
<title>Sertifikatni tekshirish — Shokirov Math Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/app.css?v=38c188e7" />
<style>
  .verify-wrap { max-width: 620px; margin: 0 auto; }
  .verdict { text-align: center; padding: 26px 20px; border-radius: 18px; margin-bottom: 20px; }
  .verdict.ok  { background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.4); }
  .verdict.bad { background: rgba(251,113,133,.12); border: 1px solid rgba(251,113,133,.4); }
  .verdict .ic { width: 60px; height: 60px; margin: 0 auto 12px; border-radius: 50%; display: grid; place-items: center; }
  .verdict.ok .ic  { background: rgba(52,211,153,.2); }
  .verdict.bad .ic { background: rgba(251,113,133,.2); }
  .verdict .ic svg { width: 32px; height: 32px; fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
  .verdict.ok  .ic svg { stroke: var(--success); }
  .verdict.bad .ic svg { stroke: var(--danger); }
  .verdict h1 { font-family: var(--display); font-size: 22px; margin-bottom: 5px; }
  .verdict p { color: var(--muted); font-size: 14.5px; }
  .info-list { display: grid; gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
  .info-list div { display: flex; justify-content: space-between; gap: 14px; padding: 13px 16px; background: var(--surface); font-size: 14.5px; }
  .info-list div span:first-child { color: var(--muted); }
  .info-list div span:last-child { font-weight: 600; text-align: right; }
  .search-row { display: flex; gap: 9px; margin-top: 18px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="container bar">
    <a href="index.html" class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6.5 L8 6.5 L13 12 L8 17.5 L17 17.5"/></svg></span><span>Shokirov Math<small>Sertifikat tekshiruvi</small></span></a>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" aria-label="Rejim">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="index.html" class="btn btn-ghost btn-sm">← Bosh sahifa</a>
    </div>
  </div>
</header>

<main class="container page">
  <div class="verify-wrap">
    <div id="natija"><div class="empty">Tekshirilmoqda…</div></div>

    <div class="card" style="margin-top:20px;">
      <div class="section-title" style="font-size:16px; margin-bottom:4px;">Boshqa sertifikatni tekshirish</div>
      <p class="muted small">Sertifikat raqamini kiriting</p>
      <form class="search-row" onsubmit="return qidir(event)">
        <input class="input" id="num" placeholder="SMA-2026-001" />
        <button class="btn btn-primary" type="submit">Tekshirish</button>
      </form>
    </div>
  </div>
</main>

<script src="assets/config.js"></script>
<script src="assets/app.js?v=38c188e7"></script>
<script>
  const V = () => document.getElementById('natija');

  function qidir(e) {
    if (e) e.preventDefault();
    const n = document.getElementById('num').value.trim();
    if (!n) return false;
    history.replaceState(null, '', '?n=' + encodeURIComponent(n));
    tekshir(n);
    return false;
  }

  async function tekshir(num) {
    V().innerHTML = '<div class="empty">Tekshirilmoqda…</div>';
    let d;
    try {
      d = await api.get('/api/verify/' + encodeURIComponent(num));
    } catch (err) {
      V().innerHTML = `
        <div class="verdict bad">
          <div class="ic"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
          <h1>Sertifikat topilmadi</h1>
          <p>${esc(num)} — bu raqamli sertifikat bazada yo'q.<br>Raqamni tekshirib qayta urinib ko'ring.</p>
        </div>`;
      return;
    }
    V().innerHTML = `
      <div class="verdict ok">
        <div class="ic"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
        <h1>Sertifikat haqiqiy</h1>
        <p>Bu sertifikat Shokirov Math Academy tomonidan berilgan</p>
      </div>
      <div class="info-list">
        <div><span>Sertifikat raqami</span><span>${esc(d.number)}</span></div>
        <div><span>Egasi</span><span>${esc(d.student_name || '—')}</span></div>
        <div><span>Kurs</span><span>${esc(d.course_title || '—')}</span></div>
        <div><span>Davomiyligi</span><span>${esc(d.duration || '—')}</span></div>
        <div><span>Berilgan sana</span><span>${fmtDate(d.issued_at)}</span></div>
        ${d.score != null ? `<div><span>Natija</span><span>${d.score}%</span></div>` : ''}
      </div>`;
  }

  const p = new URLSearchParams(location.search).get('n');
  if (p) { document.getElementById('num').value = p; tekshir(p); }
  else V().innerHTML = '<div class="empty">Sertifikat raqamini kiriting yoki QR kodni skanerlang</div>';
</script>
</body>
</html>
